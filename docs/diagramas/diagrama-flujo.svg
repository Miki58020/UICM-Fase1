<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2200" viewBox="0 0 1500 2200" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14532D"/>
    </marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <marker id="ahY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B4881B"/>
    </marker>
  </defs>

  <rect width="1500" height="2200" fill="#FFFFFF"/>

  <!-- ================= TITULO ================= -->
  <text x="45" y="46" font-size="31" font-weight="700" fill="#14532D">UICM — Diagrama de Flujo: Ciclo de una Petición</text>
  <text x="47" y="76" font-size="15" fill="#6B7280">Cómo procesa el sistema cualquier acción de un usuario, desde que hace clic hasta que ve el resultado — aplica a todos los módulos</text>

  <!-- ================= INICIO ================= -->
  <rect x="489" y="105" width="522" height="62" rx="31" fill="#14532D"/>
  <text x="750" y="143" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">INICIO — el actor hace clic o envía un formulario</text>
  <path d="M750,167 V190" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>

  <!-- routes/web.php -->
  <rect x="489" y="196" width="522" height="57" rx="10" fill="#FFFFFF" stroke="#14532D" stroke-width="2"/>
  <text x="750" y="231" font-size="16" fill="#111827" text-anchor="middle">Request HTTP entra por <tspan font-weight="700">routes/web.php</tspan></text>
  <path d="M750,253 V294" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>

  <!-- ================= D1 sesion ================= -->
  <polygon points="750,300 1050,352 750,405 450,352" fill="#EAF2FE" stroke="#2563EB" stroke-width="2"/>
  <text x="750" y="346" font-size="16" fill="#111827" text-anchor="middle">¿Hay sesión iniciada válida,</text>
  <text x="750" y="368" font-size="16" fill="#111827" text-anchor="middle">si la ruta lo requiere?</text>
  <rect x="40" y="318" width="380" height="68" rx="10" fill="#FEF6EC" stroke="#F0A860" stroke-width="2"/>
  <text x="230" y="345" font-size="15" font-weight="700" fill="#C2410C" text-anchor="middle">Redirige a /login</text>
  <text x="230" y="368" font-size="13" fill="#9CA3AF" text-anchor="middle">Fin de esta petición</text>
  <path d="M450,352 H426" stroke="#C2410C" stroke-width="2.5" fill="none" marker-end="url(#ahO)"/>
  <text x="437" y="343" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">No</text>
  <path d="M750,405 V446" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>
  <text x="768" y="429" font-size="13" font-weight="700" fill="#14532D">Sí</text>

  <!-- ================= D2 rol ================= -->
  <polygon points="750,452 1050,504 750,557 450,504" fill="#EAF2FE" stroke="#2563EB" stroke-width="2"/>
  <text x="750" y="498" font-size="16" fill="#111827" text-anchor="middle">¿El rol tiene permiso para</text>
  <text x="750" y="520" font-size="16" fill="#111827" text-anchor="middle">esta ruta? (middleware rol:*)</text>
  <rect x="40" y="470" width="380" height="68" rx="10" fill="#FEF6EC" stroke="#F0A860" stroke-width="2"/>
  <text x="230" y="497" font-size="15" font-weight="700" fill="#C2410C" text-anchor="middle">Responde 403 — Acceso denegado</text>
  <text x="230" y="520" font-size="13" fill="#9CA3AF" text-anchor="middle">Fin de esta petición</text>
  <path d="M450,504 H426" stroke="#C2410C" stroke-width="2.5" fill="none" marker-end="url(#ahO)"/>
  <text x="437" y="495" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">No</text>
  <path d="M750,557 V594" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>
  <text x="768" y="581" font-size="13" font-weight="700" fill="#14532D">Sí</text>

  <!-- Controller recibe -->
  <rect x="489" y="600" width="522" height="57" rx="10" fill="#FFFFFF" stroke="#14532D" stroke-width="2"/>
  <text x="750" y="635" font-size="16" fill="#111827" text-anchor="middle">El <tspan font-weight="700">Controller</tspan> del módulo recibe la petición</text>
  <path d="M750,657 V694" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>

  <!-- ================= D3 trae datos ================= -->
  <polygon points="750,700 1050,752 750,805 450,752" fill="#EAF2FE" stroke="#2563EB" stroke-width="2"/>
  <text x="750" y="746" font-size="16" fill="#111827" text-anchor="middle">¿Trae datos de formulario</text>
  <text x="750" y="768" font-size="16" fill="#111827" text-anchor="middle">(POST / PUT)?</text>
  <path d="M750,805 V844" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>
  <text x="768" y="831" font-size="13" font-weight="700" fill="#14532D">Sí</text>
  <!-- rama No: sin datos de formulario -->
  <path d="M1050,752 H1180 V1125 H1019" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#ahB)"/>
  <text x="1093" y="744" font-size="13" font-weight="700" fill="#2563EB">No</text>
  <text x="1172" y="1113" font-size="12" fill="#2563EB" text-anchor="end">(sin datos de formulario)</text>

  <!-- CORREGIDO: validacion en el controlador, no Form Request -->
  <rect x="489" y="850" width="522" height="57" rx="10" fill="#FFFFFF" stroke="#14532D" stroke-width="2"/>
  <text x="750" y="885" font-size="16" fill="#111827" text-anchor="middle">El <tspan font-weight="700">Controller</tspan> valida los datos con las reglas del módulo</text>
  <path d="M750,907 V944" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>

  <!-- ================= D4 datos validos ================= -->
  <polygon points="750,950 1050,1002 750,1055 450,1002" fill="#EAF2FE" stroke="#2563EB" stroke-width="2"/>
  <text x="750" y="996" font-size="16" fill="#111827" text-anchor="middle">¿Los datos son</text>
  <text x="750" y="1018" font-size="16" fill="#111827" text-anchor="middle">válidos?</text>
  <!-- CORREGIDO: 302 en formulario / 422 en AJAX -->
  <rect x="40" y="962" width="380" height="80" rx="10" fill="#FEF6EC" stroke="#F0A860" stroke-width="2"/>
  <text x="230" y="990" font-size="15" font-weight="700" fill="#C2410C" text-anchor="middle">Rechaza la petición con los errores</text>
  <text x="230" y="1012" font-size="12.5" fill="#9CA3AF" text-anchor="middle">302 de vuelta al formulario, o 422 en JSON</text>
  <text x="230" y="1030" font-size="12.5" fill="#9CA3AF" text-anchor="middle">si la petición es asíncrona (Alpine)</text>
  <path d="M450,1002 H426" stroke="#C2410C" stroke-width="2.5" fill="none" marker-end="url(#ahO)"/>
  <text x="437" y="993" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">No</text>
  <path d="M750,1055 V1084" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>
  <text x="768" y="1076" font-size="13" font-weight="700" fill="#14532D">Sí</text>

  <!-- logica de negocio -->
  <rect x="489" y="1090" width="522" height="70" rx="10" fill="#F0F7F2" stroke="#14532D" stroke-width="2"/>
  <text x="750" y="1119" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Controller ejecuta la lógica de negocio</text>
  <text x="750" y="1141" font-size="13" fill="#6B7280" text-anchor="middle">del módulo (reglas, cálculos, permisos finos)</text>
  <path d="M750,1160 V1194" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>

  <!-- ================= D5 servicio externo ================= -->
  <polygon points="750,1200 1050,1252 750,1305 450,1252" fill="#EAF2FE" stroke="#2563EB" stroke-width="2"/>
  <text x="750" y="1246" font-size="16" fill="#111827" text-anchor="middle">¿Requiere un servicio externo?</text>
  <text x="750" y="1268" font-size="16" fill="#111827" text-anchor="middle">(pago en línea / correo)</text>
  <path d="M750,1305 V1344" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>
  <text x="768" y="1331" font-size="13" font-weight="700" fill="#14532D">Sí</text>
  <path d="M1050,1252 H1180 V1742 H1019" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#ahB)"/>
  <text x="1093" y="1244" font-size="13" font-weight="700" fill="#2563EB">No</text>

  <!-- CORREGIDO: Checkout Pro, no Bricks -->
  <rect x="489" y="1350" width="522" height="57" rx="10" fill="#FDF6DC" stroke="#E3B341" stroke-width="2"/>
  <text x="750" y="1385" font-size="16" font-weight="700" fill="#7A5B10" text-anchor="middle">Llama a Mercado Pago (Checkout Pro) o SMTP</text>
  <path d="M750,1407 V1444" stroke="#B4881B" stroke-width="2.5" fill="none" marker-end="url(#ahY)"/>

  <!-- ================= D6 respuesta exitosa ================= -->
  <polygon points="750,1450 1050,1502 750,1555 450,1502" fill="#EAF2FE" stroke="#2563EB" stroke-width="2"/>
  <text x="750" y="1496" font-size="16" fill="#111827" text-anchor="middle">¿Respuesta exitosa</text>
  <text x="750" y="1518" font-size="16" fill="#111827" text-anchor="middle">del servicio?</text>
  <path d="M1050,1502 H1115 V1706 H1019" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#ahB)"/>
  <text x="1063" y="1494" font-size="13" font-weight="700" fill="#2563EB">Sí</text>
  <path d="M750,1555 V1584" stroke="#C2410C" stroke-width="2.5" fill="none" marker-end="url(#ahO)"/>
  <text x="768" y="1576" font-size="13" font-weight="700" fill="#C2410C">No</text>

  <rect x="489" y="1590" width="522" height="70" rx="10" fill="#FEF6EC" stroke="#F0A860" stroke-width="2"/>
  <text x="750" y="1619" font-size="16" font-weight="700" fill="#C2410C" text-anchor="middle">Registra el error / marca pendiente</text>
  <text x="750" y="1641" font-size="13" fill="#6B7280" text-anchor="middle">no detiene el flujo (ej. correo con reintento)</text>
  <path d="M750,1660 V1684" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>

  <!-- CORREGIDO: MariaDB + sin transaccion atomica -->
  <rect x="489" y="1690" width="522" height="70" rx="10" fill="#EAF2FE" stroke="#2563EB" stroke-width="2"/>
  <text x="750" y="1719" font-size="16" font-weight="700" fill="#1E40AF" text-anchor="middle">Eloquent ORM lee o escribe en MariaDB</text>
  <text x="750" y="1741" font-size="13" fill="#6B7280" text-anchor="middle">las restricciones del esquema (InnoDB) resguardan la integridad</text>
  <path d="M750,1760 V1794" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>

  <!-- prepara respuesta -->
  <rect x="489" y="1800" width="522" height="57" rx="10" fill="#FFFFFF" stroke="#14532D" stroke-width="2"/>
  <text x="750" y="1835" font-size="16" fill="#111827" text-anchor="middle">Controller prepara la respuesta</text>
  <path d="M750,1857 V1894" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>

  <!-- ================= D7 AJAX ================= -->
  <polygon points="750,1900 1050,1952 750,2005 450,1952" fill="#EAF2FE" stroke="#2563EB" stroke-width="2"/>
  <text x="750" y="1946" font-size="16" fill="#111827" text-anchor="middle">¿Es una petición</text>
  <text x="750" y="1968" font-size="16" fill="#111827" text-anchor="middle">Alpine/fetch (AJAX)?</text>

  <rect x="150" y="1921" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#14532D" stroke-width="2"/>
  <text x="290" y="1946" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Renderiza vista</text>
  <text x="290" y="1968" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Blade</text>
  <path d="M450,1952 H436" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>
  <text x="443" y="1941" font-size="13" font-weight="700" fill="#14532D" text-anchor="middle">No</text>

  <rect x="1070" y="1921" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#14532D" stroke-width="2"/>
  <text x="1210" y="1946" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Responde</text>
  <text x="1210" y="1968" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">JSON</text>
  <path d="M1050,1952 H1064" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>
  <text x="1057" y="1941" font-size="13" font-weight="700" fill="#14532D" text-anchor="middle">Sí</text>

  <path d="M290,1983 V2016 H750 V2034" stroke="#14532D" stroke-width="2.5" fill="none" marker-end="url(#ahG)"/>
  <path d="M1210,1983 V2016 H750" stroke="#14532D" stroke-width="2.5" fill="none"/>

  <!-- ================= FIN ================= -->
  <rect x="489" y="2040" width="522" height="62" rx="31" fill="#14532D"/>
  <text x="750" y="2078" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">FIN — el actor ve el resultado en el navegador</text>

  <!-- ================= LEYENDA ================= -->
  <g transform="translate(1140,2020)">
    <rect x="0" y="0" width="22" height="16" rx="4" fill="#FFFFFF" stroke="#14532D" stroke-width="2"/>
    <text x="32" y="13" font-size="13" fill="#374151">Proceso</text>
    <rect x="0" y="26" width="22" height="16" rx="4" fill="#EAF2FE" stroke="#2563EB" stroke-width="2"/>
    <text x="32" y="39" font-size="13" fill="#374151">Decisión</text>
    <rect x="0" y="52" width="22" height="16" rx="4" fill="#FEF6EC" stroke="#F0A860" stroke-width="2"/>
    <text x="32" y="65" font-size="13" fill="#374151">Salida / error</text>
    <rect x="0" y="78" width="22" height="16" rx="4" fill="#FDF6DC" stroke="#E3B341" stroke-width="2"/>
    <text x="32" y="91" font-size="13" fill="#374151">Servicio externo</text>
    <circle cx="11" cy="112" r="8" fill="#14532D"/>
    <text x="32" y="117" font-size="13" fill="#374151">Inicio / Fin</text>
  </g>

</svg>
