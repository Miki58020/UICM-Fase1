      <rect x="70"   y="895" width="173" height="34" rx="17" stroke-width="1.2"/>
      <rect x="253"  y="895" width="173" height="34" rx="17" stroke-width="1.2"/>
      <rect x="436"  y="895" width="173" height="34" rx="17" stroke-width="1.2"/>
      <rect x="619"  y="895" width="173" height="34" rx="17" stroke-width="1.2"/>
      <rect x="802"  y="895" width="173" height="34" rx="17" stroke-width="1.2"/>
      <rect x="985"  y="895" width="173" height="34" rx="17" stroke-width="1.2"/>
      <rect x="1168" y="895" width="173" height="34" rx="17" stroke-width="1.2"/>
      <rect x="1351" y="895" width="173" height="34" rx="17" stroke-width="1.2"/>
    </g>

    <text x="156.5"  y="871" text-anchor="middle">Alumno</text>
    <text x="339.5"  y="871" text-anchor="middle">Aspirante</text>
    <text x="522.5"  y="871" text-anchor="middle">Profesor</text>
    <text x="705.5"  y="871" text-anchor="middle">Programa</text>
    <text x="888.5"  y="871" text-anchor="middle">Periodo</text>
    <text x="1071.5" y="871" text-anchor="middle">Materia</text>
    <text x="1254.5" y="871" text-anchor="middle">Grupo</text>
    <text x="1437.5" y="871" text-anchor="middle" font-size="9.5">Carga Académica</text>

    <text x="156.5"  y="916" text-anchor="middle" font-size="9.5">Calificación</text>
    <text x="339.5"  y="916" text-anchor="middle" font-size="9.5">Aclaración</text>
    <text x="522.5"  y="916" text-anchor="middle">Pago</text>
    <text x="705.5"  y="916" text-anchor="middle">Tarifa</text>
    <text x="888.5"  y="916" text-anchor="middle">Documento</text>
    <text x="1071.5" y="916" text-anchor="middle">Contacto</text>
