<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F4229"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d0a"/>
    </marker>
    <marker id="arrowGreenBig" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="26" markerHeight="26" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F4229"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1090" fill="#ffffff"/>

  <!-- ================= TITLE ================= -->
  <text x="50" y="45" font-size="26" font-weight="800" fill="#0F4229">UICM — Diagrama de Bloques del Sistema</text>
  <text x="50" y="68" font-size="13" fill="#6b7280">Arquitectura técnica (capas) + módulos funcionales — Sistema Integral de Gestión para la UICM</text>

  <!-- ================= SECTION 1: ACTORES ================= -->
  <text x="50" y="112" font-size="12.5" font-weight="800" fill="#1F5FBF" letter-spacing="0.5">ACTORES Y ROLES DEL SISTEMA</text>

  <!-- Actor boxes: x=50,354,658,962,1266  w=280 y=130 h=90 -->
  <g font-size="9.5" fill="#6b7280">
    <!-- c1 Aspirante -->
    <rect x="50" y="130" width="280" height="90" rx="10" fill="#ffffff" stroke="#1F5FBF" stroke-width="2"/>
    <text x="190" y="150" text-anchor="middle" fill="#1F5FBF" font-weight="700">PÚBLICO</text>
    <text x="190" y="170" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">ASPIRANTE</text>
    <text x="190" y="190" text-anchor="middle" fill="#6b7280">Sin cuenta en el sistema</text>

    <!-- c2 Alumno -->
    <rect x="354" y="130" width="280" height="90" rx="10" fill="#ffffff" stroke="#1F5FBF" stroke-width="2"/>
    <text x="494" y="150" text-anchor="middle" fill="#1F5FBF" font-weight="700">rol: alumno</text>
    <text x="494" y="170" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">ALUMNO</text>
    <text x="494" y="190" text-anchor="middle" fill="#6b7280">Inscrito y con acceso al portal</text>

    <!-- c3 Profesor -->
    <rect x="658" y="130" width="280" height="90" rx="10" fill="#ffffff" stroke="#1F5FBF" stroke-width="2"/>
    <text x="798" y="150" text-anchor="middle" fill="#1F5FBF" font-weight="700">rol: profesor</text>
    <text x="798" y="170" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">PROFESOR</text>
    <text x="798" y="190" text-anchor="middle" fill="#6b7280">Titular de grupos/materias</text>

    <!-- c4 Personal Administrativo -->
    <rect x="962" y="130" width="280" height="90" rx="10" fill="#ffffff" stroke="#1F5FBF" stroke-width="2"/>
    <text x="1102" y="150" text-anchor="middle" fill="#1F5FBF" font-weight="700">rol: admin / coordinación / control_escolar</text>
    <text x="1102" y="170" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">PERSONAL ADMINISTRATIVO</text>
    <text x="1102" y="190" text-anchor="middle" fill="#6b7280">Control Escolar · Coordinación · Admin</text>

    <!-- c5 Finanzas -->
    <rect x="1266" y="130" width="280" height="90" rx="10" fill="#ffffff" stroke="#1F5FBF" stroke-width="2"/>
    <text x="1406" y="150" text-anchor="middle" fill="#1F5FBF" font-weight="700">rol: finanzas</text>
    <text x="1406" y="170" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">FINANZAS</text>
    <text x="1406" y="190" text-anchor="middle" fill="#6b7280">Validación de pagos e ingresos</text>
  </g>

  <!-- Arrows row1 -> row2 -->
  <g stroke="#0F4229" stroke-width="2.5" marker-end="url(#arrowGreen)">
    <line x1="190" y1="221" x2="190" y2="267"/>
    <line x1="494" y1="221" x2="494" y2="267"/>
    <line x1="798" y1="221" x2="798" y2="267"/>
    <line x1="1102" y1="221" x2="1102" y2="267"/>
    <line x1="1406" y1="221" x2="1406" y2="267"/>
  </g>

  <!-- ================= SECTION 2: FRONTEND ================= -->
  <!-- Frontend boxes: x=50,354,658,962,1266 w=280 y=270 h=100 -->
  <g>
    <!-- c1 Sitio Público -->
    <rect x="50" y="270" width="280" height="100" rx="10" fill="#fef4e3" stroke="#EFAD5A" stroke-width="2"/>
    <text x="190" y="288" text-anchor="middle" font-size="9.5" fill="#b0530a" font-weight="700">FRONTEND</text>
    <text x="190" y="307" text-anchor="middle" font-size="13.5" font-weight="800" fill="#111827">Sitio Público</text>
    <text x="190" y="325" text-anchor="middle" font-size="10.5" fill="#6b7280">Landing · Registro</text>
    <text x="190" y="340" text-anchor="middle" font-size="10.5" fill="#6b7280">Oferta educativa</text>

    <!-- c2 Portal Alumno -->
    <rect x="354" y="270" width="280" height="100" rx="10" fill="#fef4e3" stroke="#EFAD5A" stroke-width="2"/>
    <text x="494" y="288" text-anchor="middle" font-size="9.5" fill="#b0530a" font-weight="700">FRONTEND</text>
    <text x="494" y="307" text-anchor="middle" font-size="13.5" font-weight="800" fill="#111827">Portal Alumno</text>
    <text x="494" y="325" text-anchor="middle" font-size="10.5" fill="#6b7280">Dashboard · Materias · Kárdex</text>
    <text x="494" y="340" text-anchor="middle" font-size="10.5" fill="#6b7280">Finanzas · Documentos</text>

    <!-- c3 Portal Profesor -->
    <rect x="658" y="270" width="280" height="100" rx="10" fill="#fef4e3" stroke="#EFAD5A" stroke-width="2"/>
    <text x="798" y="288" text-anchor="middle" font-size="9.5" fill="#b0530a" font-weight="700">FRONTEND</text>
    <text x="798" y="307" text-anchor="middle" font-size="13.5" font-weight="800" fill="#111827">Portal Profesor</text>
    <text x="798" y="325" text-anchor="middle" font-size="10.5" fill="#6b7280">Calificaciones · Aclaraciones</text>
    <text x="798" y="340" text-anchor="middle" font-size="10.5" fill="#6b7280">Horario · Grupos</text>

    <!-- c4 Panel Administrativo -->
    <rect x="962" y="270" width="280" height="100" rx="10" fill="#fef4e3" stroke="#EFAD5A" stroke-width="2"/>
    <text x="1102" y="288" text-anchor="middle" font-size="9.5" fill="#b0530a" font-weight="700">FRONTEND</text>
    <text x="1102" y="307" text-anchor="middle" font-size="13.5" font-weight="800" fill="#111827">Panel Administrativo</text>
    <text x="1102" y="325" text-anchor="middle" font-size="10.5" fill="#6b7280">Aspirantes · Alumnos · Catálogos</text>
    <text x="1102" y="340" text-anchor="middle" font-size="10.5" fill="#6b7280">Usuarios · Configuración</text>

    <!-- c5 Panel Finanzas -->
    <rect x="1266" y="270" width="280" height="100" rx="10" fill="#fef4e3" stroke="#EFAD5A" stroke-width="2"/>
    <text x="1406" y="288" text-anchor="middle" font-size="9.5" fill="#b0530a" font-weight="700">FRONTEND</text>
    <text x="1406" y="307" text-anchor="middle" font-size="13.5" font-weight="800" fill="#111827">Panel Finanzas</text>
    <text x="1406" y="325" text-anchor="middle" font-size="10.5" fill="#6b7280">Validación de pagos</text>
    <text x="1406" y="340" text-anchor="middle" font-size="10.5" fill="#6b7280">Estadísticas</text>
  </g>
  <text x="50" y="390" font-size="10.5" fill="#9ca3af">Blade Templates · Tailwind CSS · Alpine.js</text>

  <!-- Big arrow: Frontend -> Backend -->
  <line x1="800" y1="378" x2="800" y2="448" stroke="#0F4229" stroke-width="12" marker-end="url(#arrowGreenBig)"/>
  <text x="820" y="418" font-size="11.5" fill="#374151" font-weight="600">Peticiones HTTP</text>
  <text x="820" y="433" font-size="10" fill="#6b7280">routes/web.php + middleware rol:*</text>

  <!-- ================= SECTION 3: BACKEND ================= -->
  <text x="50" y="460" font-size="12.5" font-weight="800" fill="#0F4229" letter-spacing="0.5">CAPA DE APLICACIÓN — LARAVEL (Controllers · Middleware · Form Requests)</text>
  <rect x="50" y="470" width="1090" height="255" rx="14" fill="#f0f9f4" stroke="#0F4229" stroke-width="2"/>

