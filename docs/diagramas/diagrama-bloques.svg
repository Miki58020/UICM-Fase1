    <text x="238" y="564" text-anchor="middle" font-size="10" fill="#6b7280">Contacto</text>

    <rect x="426" y="505" width="336" height="90" rx="8" fill="#ffffff" stroke="#0F4229" stroke-width="1.5"/>
