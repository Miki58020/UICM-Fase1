  <text x="50" y="1050" font-size="10" fill="#9ca3af">Sistema Integral de Gestión para la UICM · Stack: Laravel + MariaDB + Tailwind CSS + Alpine.js · Integraciones: Mercado Pago Checkout Pro, SMTP</text>

