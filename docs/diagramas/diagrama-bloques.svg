    <text x="950" y="550" text-anchor="middle" font-size="10" fill="#6b7280">Pagos · Tarifas</text>
    <text x="950" y="564" text-anchor="middle" font-size="10" fill="#6b7280">Estado de cuenta</text>

    <rect x="70" y="605" width="336" height="90" rx="8" fill="#ffffff" stroke="#0F4229" stroke-width="1.5"/>
    <text x="238" y="630" text-anchor="middle" font-size="13" font-weight="800" fill="#0F4229">Usuarios &amp; Accesos</text>
    <text x="238" y="650" text-anchor="middle" font-size="10" fill="#6b7280">Auth · Perfil</text>
    <text x="238" y="664" text-anchor="middle" font-size="10" fill="#6b7280">Solicitud de contraseña</text>

    <rect x="426" y="605" width="336" height="90" rx="8" fill="#ffffff" stroke="#0F4229" stroke-width="1.5"/>
    <text x="594" y="630" text-anchor="middle" font-size="13" font-weight="800" fill="#0F4229">Documentos &amp; Expediente</text>
    <text x="594" y="650" text-anchor="middle" font-size="10" fill="#6b7280">DocumentoAlumno</text>
    <text x="594" y="664" text-anchor="middle" font-size="10" fill="#6b7280">Expediente</text>

    <rect x="782" y="605" width="336" height="90" rx="8" fill="#ffffff" stroke="#0F4229" stroke-width="1.5"/>
    <text x="950" y="627" text-anchor="middle" font-size="13" font-weight="800" fill="#0F4229">Configuración &amp; Avisos</text>
    <text x="950" y="645" text-anchor="middle" font-size="10" fill="#6b7280">APIs MercadoPago/Correo</text>
    <text x="950" y="659" text-anchor="middle" font-size="10" fill="#6b7280">Página principal · Notificaciones</text>
  </g>

  <!-- ================= SERVICIOS EXTERNOS ================= -->
  <text x="1170" y="460" font-size="12.5" font-weight="800" fill="#8a6d0a" letter-spacing="0.5">SERVICIOS EXTERNOS</text>

  <rect x="1170" y="497" width="380" height="105" rx="12" fill="#fdf3d0" stroke="#D4AF37" stroke-width="2"/>
  <text x="1360" y="530" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">MercadoPago</text>
  <text x="1360" y="550" text-anchor="middle" font-size="10.5" fill="#6b7280">Checkout Pro — cobro de inscripción</text>
  <text x="1360" y="565" text-anchor="middle" font-size="10.5" fill="#6b7280">en línea (sandbox / producción)</text>

  <rect x="1170" y="618" width="380" height="105" rx="12" fill="#fdf3d0" stroke="#D4AF37" stroke-width="2"/>
  <text x="1360" y="651" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">SMTP / Correo</text>
  <text x="1360" y="671" text-anchor="middle" font-size="10.5" fill="#6b7280">Notificaciones automáticas</text>
  <text x="1360" y="686" text-anchor="middle" font-size="10.5" fill="#6b7280">(folios, accesos, avisos)</text>

  <!-- Bidirectional arrows Backend <-> Servicios externos -->
  <g stroke="#8a6d0a" stroke-width="2.5" marker-end="url(#arrowGold)" marker-start="url(#arrowGold)">
    <line x1="1143" y1="549" x2="1167" y2="549"/>
    <line x1="1143" y1="670" x2="1167" y2="670"/>
  </g>

  <!-- Big arrow: Backend -> Data -->
  <line x1="800" y1="730" x2="800" y2="800" stroke="#0F4229" stroke-width="12" marker-end="url(#arrowGreenBig)"/>
  <text x="820" y="768" font-size="11.5" fill="#374151" font-weight="600">Eloquent ORM</text>

  <!-- ================= SECTION 4: DATA ================= -->
  <text x="50" y="805" font-size="12.5" font-weight="800" fill="#1F5FBF" letter-spacing="0.5">CAPA DE DATOS — MariaDB 11.8 (InnoDB)</text>
  <rect x="50" y="815" width="1500" height="145" rx="14" fill="#eaf2fd" stroke="#1F5FBF" stroke-width="2"/>

  <!-- 16 entity pills: cols x=70,253,436,619,802,985,1168,1351 w=173  rows y=850,895 h=34 -->
