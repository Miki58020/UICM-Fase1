    <g fill="#cfe0f7" stroke="#1F5FBF">
      <rect x="70"   y="850" width="173" height="34" rx="17" stroke-width="1.2"/>
      <rect x="253"  y="850" width="173" height="34" rx="17" stroke-width="1.2"/>
