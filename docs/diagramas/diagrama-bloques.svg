    <text x="1437.5" y="916" text-anchor="middle" font-size="9.5">Configuración</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g font-size="11" fill="#374151">
    <rect x="50" y="990" width="16" height="16" rx="3" fill="#ffffff" stroke="#1F5FBF" stroke-width="2"/>
    <text x="72" y="1002">Actores / Roles</text>

    <rect x="220" y="990" width="16" height="16" rx="3" fill="#fef4e3" stroke="#EFAD5A" stroke-width="2"/>
