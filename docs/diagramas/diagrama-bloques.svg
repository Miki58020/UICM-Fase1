  <g>
    <rect x="70" y="505" width="336" height="90" rx="8" fill="#ffffff" stroke="#0F4229" stroke-width="1.5"/>
    <text x="238" y="530" text-anchor="middle" font-size="13" font-weight="800" fill="#0F4229">Admisión</text>
