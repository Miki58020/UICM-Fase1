    <text x="594" y="545" text-anchor="middle" font-size="10" fill="#6b7280">Materias · Grupos · Calificaciones</text>
    <text x="594" y="559" text-anchor="middle" font-size="10" fill="#6b7280">Carga académica · Horario</text>
    <text x="594" y="573" text-anchor="middle" font-size="10" fill="#6b7280">Aclaraciones · Reinscripción</text>

    <rect x="782" y="505" width="336" height="90" rx="8" fill="#ffffff" stroke="#0F4229" stroke-width="1.5"/>
